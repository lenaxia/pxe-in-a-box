name: Publish (one-click)

# One-click image publishing: run this workflow from the Actions UI with a
# version tag. It tags the selected ref, runs the test gate, builds and
# pushes multi-arch images to GHCR (and Docker Hub if configured), and
# creates the GitHub Release.
#
# Self-contained on purpose: tags pushed by GITHUB_TOKEN do not trigger
# other workflows, so this cannot simply delegate to release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      ref:
        description: "Git ref to tag (default: main)"
        required: false
        default: main
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Validate version
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must match vX.Y.Z (got: $version)"
            exit 1
          fi
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "::error::tag $version already exists"
            exit 1
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  test:
    name: Test (gate)
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  docker:
    name: Docker (multi-arch)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME && format('{0}/pxe-in-a-box', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Extract changelog
        id: changelog
        run: |
          tag="${{ inputs.version }}"
          if [ -f CHANGELOG.md ]; then
            body=$(awk "/## \[${tag}\]/{flag=1} /^## \[/{if(flag==1)exit} flag" CHANGELOG.md | sed '/^$/d;1d')
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "${body:-Release ${tag}}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
